<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบฝากสั่ง • SME Callcard</title>
<style>
:root{font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif;color:#1c1c1c;background:#e5e7eb}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit}
.controls{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:center;gap:9px;padding:9px;flex-wrap:wrap;box-shadow:0 2px 10px #0001}
.controls select,.controls button{border:1px solid #bbb;border-radius:6px;background:#fff;padding:8px 10px;font-size:12px;cursor:pointer}
.controls button.primary{background:#171717;color:white;border-color:#171717}.controls small{font-size:11px;color:#555}
#status{font-size:11px;min-width:110px;text-align:center}
main{padding:20px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
.paper{background:#fff;width:297mm;height:210mm;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));box-shadow:0 4px 26px #0002;overflow:hidden}
.paper.one{width:74.25mm;grid-template-columns:1fr}
.slip{height:210mm;width:100%;min-width:0;padding:5.5mm 2.6mm 4mm;position:relative;border-right:.25mm dashed #999;display:flex;flex-direction:column;color:#101010;background:#fff}
.slip:last-child{border-right:0}
.slip h2{font-size:11px;line-height:1.2;text-align:center;margin:0 0 7px;font-weight:bold}
.slip table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:5.65px;line-height:1.05}
.slip th,.slip td{border-bottom:.3px solid #b9b9b9;padding:1.15px 1px;vertical-align:middle;text-align:center}
.slip th{font-size:6px;font-weight:700;border-top:.6px solid #333;border-bottom:.6px solid #333;height:20px}
.slip td{height:11.65px}
.slip td.name,.slip th.name{text-align:left;overflow-wrap:anywhere;word-break:normal}
.slip .barcode{width:18%}.slip .name{width:48%}.slip .price{width:9%}.slip .pk{width:6%}.slip .status{width:9%}.slip .qty{width:10%}
.slip .foot{margin-top:auto;font-size:6.7px;line-height:2.2;padding:4px 0 0}
.slip .signrow{display:flex;justify-content:space-between;gap:2px;white-space:nowrap}
#message{padding:40px;max-width:550px;background:#fff;border:1px solid #ddd;border-radius:6px;text-align:center;line-height:1.8}
@media(max-width:1150px){main{align-items:flex-start;overflow-x:auto}.paper{flex:none;transform-origin:top left}}
@page{size:A4 landscape;margin:0}
@media print{
  :root{background:#fff}body{margin:0} .controls,#message{display:none!important}
  main{display:block;padding:0;overflow:visible}.paper{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .paper:last-child{break-after:auto;page-break-after:auto}
  .paper.one{width:74.25mm} .slip{border-right:.25mm dashed #aaa}
}
</style>
<style>
/* Document dimensions reproduce the four narrow slips on the reference A4. */
.paper{padding:5mm 5mm 0;gap:2.5mm;align-items:start}
.paper.one{padding:5mm 0 0}
.slip{height:auto;min-height:0;width:100%;padding:0;border:.22mm solid #777;display:block}
.slip:last-child{border-right:.22mm solid #777}
.slip .brandhead{height:12.3mm;display:flex;align-items:center;justify-content:space-around;gap:2mm;padding:1mm 1.5mm}
.slip .smooth{font-family:Georgia,serif;font-size:13px;color:#00a59e;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.slip .smooth sup{font-size:8px;color:#8cba56}
.slip .brandhead strong{font-size:10px;white-space:nowrap}
.slip .dentiste{font-size:7.7px;color:#007861;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.slip .dentiste .cross{display:inline-block;background:#00816c;width:11px;height:11px;vertical-align:middle;margin-right:2px;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
.slip .dentiste small{display:block;text-align:center;font-size:3.6px;letter-spacing:0}
.slip table{font-size:5.45px;line-height:1.15}
.slip th,.slip td{border:.22px solid #9b9b9b;padding:1px 1px}
.slip th{background:#00a748;color:#fff;border-color:#078637;height:18px;font-size:5.5px}
.slip th.name{position:relative}
.slip th.name .seven{position:absolute;left:-7px;top:1px;background:white;border:1px solid #eee;color:#e21e25;font-size:5px;line-height:1;padding:1px;font-weight:900}
.slip td{height:11.6px}
.slip .barcode{width:12%}.slip .name{width:58%}.slip .price{width:8%}.slip .pk{width:6%}.slip .status{width:8%}.slip .qty{width:8%}
.slip .foot{margin-top:0;border-top:0;font-size:5.65px;padding:6px 1px 2px;line-height:2.25}
.slip .foot .signrow{justify-content:flex-start}
.slip .foot .signrow span{display:block;width:50%;overflow:hidden}
.slip .tagred{color:red;font-weight:bold}
@media print{.paper{padding:5mm 5mm 0}.slip{border:.22mm solid #777!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.slip th{background:#00a748!important;color:#fff!important}.paper.one{padding:5mm 0 0}}
</style></head>
<body>
<div class="controls">
<select id="mode" aria-label="รูปแบบใบฝากสั่ง">
<option value="appsheet">เรียงตาม AppSheet</option>
<option value="category">เรียงตามประเภทสินค้า</option>
</select>
<select id="layout" aria-label="จำนวนใบ">
<option value="four">รวม 4 ใบ / A4 แนวนอน</option>
<option value="one">แยก 1 ใบ</option>
</select>
<button type="button" id="reload">↻ อัปเดตข้อมูล</button>
<button class="primary" type="button" id="print">พิมพ์ / บันทึก PDF</button>
<span id="status">กำลังโหลด…</span>
</div>
<main id="pages"><div id="message">กำลังโหลดใบฝากสั่งจาก Google Sheets…</div></main>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbxBmhPpf3-YhCmVbj84BcCcnhd1jb2bad1y_qaAATdgFK7d2ZWKRihQP34wNKRWpAQ/exec';
const el=id=>document.getElementById(id);
const safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[];
const valid=x=>x===true||x===1||String(x).toLowerCase()==='true';
function requestCatalog(){
 return new Promise((resolve,reject)=>{
  let done=false,timer;const cb='SME_callback_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
  const tag=document.createElement('script');
  function clear(){if(done)return;done=true;clearTimeout(timer);tag.remove();delete window[cb]}
  window[cb]=data=>{clear();resolve(data)};
  tag.onerror=()=>{clear();reject(new Error('ไม่สามารถเชื่อมต่อ API'))};
  timer=setTimeout(()=>{clear();reject(new Error('หมดเวลารอ API'))},20000);
  tag.src=API+'?action=catalog&callback='+cb+'&_='+Date.now();
  document.head.appendChild(tag);
 });
}
function activeForMode(p,mode){
 if(p.active===false)return false;
 return mode==='appsheet'?valid(p.includeAppsheet):valid(p.includeCategory);
}
function sorted(){
 const mode=el('mode').value;
 return products.filter(p=>activeForMode(p,mode)).sort((a,b)=>{
  let k=mode==='appsheet'?'orderAppsheet':'orderCategory';
  return (Number(a[k])||9999)-(Number(b[k])||9999)||String(a.name).localeCompare(String(b.name),'th');
 });
}
function createSlip(list){
 const lines=list.map(p=>{
  let name=safe(p.name);
  name=name.replace(/\((Focus|NEW)\)/gi,'<span class="tagred">($1)</span>');
  return '<tr><td>'+safe(p.barcode)+'</td><td class="name">'+name+'</td><td>'+safe(p.price)+'</td><td>'+safe(p.pk)+'</td><td></td><td></td></tr>';
 }).join('');
 return '<section class="slip"><header class="brandhead"><span class="smooth">SMOOTH E<sup>+</sup></span><strong>ใบฝากสั่ง</strong><span class="dentiste"><span class="cross"></span>DENTISTE<small>FOR YOUR HEALTH</small></span></header><table><colgroup><col class="barcode"><col class="name"><col class="price"><col class="pk"><col class="status"><col class="qty"></colgroup><thead><tr><th>BARCODE</th><th class="name"><span class="seven">7<br>ELEVEN</span>SKU NAME THAI</th><th>ราคา</th><th>PK</th><th>สถานะ</th><th>ฝากสั่ง</th></tr></thead><tbody>'+lines+'</tbody></table><div class="foot"><div class="signrow"><span>วันที่..........................</span><span>วันที่..........................</span></div><div class="signrow"><span>สั่งโดย........................</span><span>รับทราบโดย..................</span></div></div></section>';
}
function draw(){
 const list=sorted(),layout=el('layout').value,count=layout==='four'?4:1;
 if(!list.length){el('pages').innerHTML='<div id="message">ไม่พบรายการสินค้าในรูปแบบนี้ กรุณาตรวจสอบ Google Sheets</div>';el('status').textContent='ไม่มีสินค้า';return}
 const page='<article class="paper '+layout+'">'+Array(count).fill(0).map(()=>createSlip(list)).join('')+'</article>';
 el('pages').innerHTML=page;
 el('status').textContent=list.length+' รายการ';
}
async function load(){
 el('status').textContent='กำลังโหลด…';el('reload').disabled=true;
 try{
  const r=await requestCatalog();
  if(!r||r.ok!==true||!Array.isArray(r.items))throw new Error((r&&r.error)||'API ส่งข้อมูลผิดรูปแบบ');
  products=r.items;
  draw();
 }catch(err){el('status').textContent='เชื่อมต่อไม่ได้';el('pages').innerHTML='<div id="message">'+safe(err.message)+'<br>โปรดตรวจสอบการ Deploy ของ Apps Script</div>'}
 finally{el('reload').disabled=false}
}
el('mode').addEventListener('change',draw);
el('layout').addEventListener('change',draw);
el('reload').addEventListener('click',load);
el('print').addEventListener('click',()=>{if(!products.length)return;window.print()});
load();
</script>
</body></html>
